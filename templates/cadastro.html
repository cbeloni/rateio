{% extends "template.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="text-center mb-4">
            <div class="feature-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2 class="h3 mb-2">Criar Conta</h2>
            <p class="text-muted mb-0">Cadastre-se para acessar o painel de rateios</p>
        </div>

        {% if erro %}
        <div class="alert alert-danger py-2" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>{{ erro }}
        </div>
        {% endif %}

        <form method="post" action="/cadastro" class="feature-card">
            <div class="row g-3">
                <div class="col-12">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="nome" name="nome" required
                           placeholder="Seu nome" value="{{ nome or '' }}">
                </div>
                <div class="col-12">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" name="email" required
                           placeholder="seu@email.com" value="{{ email or '' }}">
                </div>
                <div class="col-md-6">
                    <label for="senha" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senha" name="senha" required
                           placeholder="Mínimo 6 caracteres" minlength="6">
                </div>
                <div class="col-md-6">
                    <label for="confirmar_senha" class="form-label">Confirmar senha</label>
                    <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" required
                           placeholder="Repita a senha" minlength="6">
                </div>
                <div class="col-12 mt-4">
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-user-check me-2"></i>Cadastrar
                        </button>
                    </div>
                </div>
            </div>
        </form>

        <p class="text-center text-muted mt-4 mb-0">
            Já tem uma conta?
            <a href="/login" class="link-success fw-bold">Entrar</a>
        </p>
    </div>
</div>
{% endblock %}
